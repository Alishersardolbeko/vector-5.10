/* ================== VECTOR admin panel ==================
   Yorug' va tungi rejim uchun bitta rang tizimi.
   Ranglar faqat :root va [data-theme] blokda belgilanadi. */

:root {
  --brand: #1f6feb;
  --brand-600: #1a5fd0;
  --brand-050: #eaf2ff;
  --accent: #ff6a00;
  --accent-050: #fff1e6;

  --bg: #f4f6fb;
  --surface: #ffffff;
  --surface-2: #f8fafc;
  --sidebar: #0d1b33;
  --sidebar-ink: #b9c6dd;
  --sidebar-ink-active: #ffffff;
  --sidebar-hover: rgba(255, 255, 255, .08);

  --ink: #0f1b2d;
  --ink-2: #46586f;
  --muted: #8194ad;
  --line: #e3e9f2;
  --line-strong: #cfd8e6;

  --ok: #16a34a;
  --ok-bg: #e7f7ee;
  --warn: #d97706;
  --warn-bg: #fff4e2;
  --danger: #e5484d;
  --danger-bg: #fdecec;
  --info: #0ea5e9;
  --info-bg: #e6f6fe;

  --radius: 14px;
  --radius-sm: 10px;
  --shadow: 0 1px 2px rgba(16, 32, 61, .06), 0 8px 24px rgba(16, 32, 61, .06);
  --shadow-lg: 0 20px 50px rgba(16, 32, 61, .16);
  --font: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --sidebar-w: 260px;
}

[data-theme="dark"] {
  --brand: #4d94ff;
  --brand-600: #3b82f6;
  --brand-050: #16263f;
  --accent: #ff8534;
  --accent-050: #33210f;

  --bg: #0b1220;
  --surface: #121c2e;
  --surface-2: #172336;
  --sidebar: #0a1120;
  --sidebar-ink: #8fa2bf;
  --sidebar-ink-active: #ffffff;
  --sidebar-hover: rgba(255, 255, 255, .07);

  --ink: #e8eef8;
  --ink-2: #b3c1d6;
  --muted: #7f90a8;
  --line: #22304a;
  --line-strong: #2e3f5e;

  --ok: #4ade80;
  --ok-bg: #10281b;
  --warn: #fbbf24;
  --warn-bg: #2c2210;
  --danger: #f87171;
  --danger-bg: #2e1618;
  --info: #38bdf8;
  --info-bg: #0d2635;

  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
  --shadow-lg: 0 20px 50px rgba(0, 0, 0, .5);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--brand); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ---------------- Tuzilma ---------------- */
.layout { display: flex; min-height: 100vh; }

.sidebar {
  width: var(--sidebar-w);
  flex: none;
  background: var(--sidebar);
  color: var(--sidebar-ink);
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}
.sidebar__brand {
  display: flex; align-items: center; gap: 10px;
  padding: 18px 20px 12px;
  color: #fff; font-weight: 800; font-size: 19px; letter-spacing: .04em;
}
.sidebar__brand img { width: 30px; height: 30px; object-fit: contain; }
.sidebar__brand:hover { text-decoration: none; }

.nav { padding: 4px 12px 20px; }
.nav__group { margin-top: 12px; }
.nav__title {
  padding: 0 12px 8px;
  font-size: 11px; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; color: #5c718f;
}
.nav__link {
  display: flex; align-items: center; gap: 11px;
  padding: 10px 12px; margin-bottom: 2px;
  border-radius: var(--radius-sm);
  color: var(--sidebar-ink); font-weight: 500; font-size: 14px;
}
.nav__link:hover { background: var(--sidebar-hover); color: #fff; text-decoration: none; }
.nav__link.is-active { background: var(--brand); color: #fff; font-weight: 600; }
.nav__icon { width: 20px; text-align: center; font-size: 15px; flex: none; }
.nav__badge {
  margin-left: auto; padding: 1px 8px; border-radius: 999px;
  background: var(--accent); color: #fff; font-size: 11px; font-weight: 700;
}
.nav__sub { margin: 2px 0 6px 31px; padding-left: 10px; border-left: 1px solid #22304a; }
.nav__sub .nav__link { padding: 7px 10px; font-size: 13px; }

/* ---------------- Yuqori panel ---------------- */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 14px;
  padding: 14px 26px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.topbar__title { margin: 0; font-size: 19px; font-weight: 700; }
.topbar__spacer { margin-left: auto; }
.burger { display: none; background: none; border: 0; font-size: 22px; color: var(--ink); cursor: pointer; }

.icon-btn {
  width: 38px; height: 38px;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--surface-2); border: 1px solid var(--line);
  border-radius: var(--radius-sm); color: var(--ink-2);
  cursor: pointer; font-size: 16px;
}
.icon-btn:hover { border-color: var(--line-strong); color: var(--ink); }

.dropdown { position: relative; }
.dropdown__menu {
  position: absolute; right: 0; top: calc(100% + 8px); min-width: 190px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius-sm); box-shadow: var(--shadow-lg);
  padding: 6px; display: none; z-index: 40;
}
.dropdown.is-open .dropdown__menu { display: block; }
.dropdown__item {
  display: flex; align-items: center; gap: 9px;
  padding: 9px 11px; border-radius: 8px;
  color: var(--ink); font-size: 14px; white-space: nowrap;
}
.dropdown__item:hover { background: var(--surface-2); text-decoration: none; }
.dropdown__item.is-active { color: var(--brand); font-weight: 600; }

.userchip { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.avatar {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--brand-050); color: var(--brand);
  display: inline-flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 14px; object-fit: cover; flex: none;
}
.userchip__name { font-weight: 600; font-size: 13px; line-height: 1.2; }
.userchip__role { color: var(--muted); font-size: 12px; }

/* ---------------- Sahifa ---------------- */
.page { padding: 24px 26px 60px; flex: 1; }
.page__head {
  display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap;
  margin-bottom: 20px;
}
.page__head h2 { margin: 0; font-size: 22px; font-weight: 700; }
.page__sub { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
.page__actions { margin-left: auto; display: flex; gap: 10px; flex-wrap: wrap; }

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.card__head {
  display: flex; align-items: center; gap: 12px;
  padding: 16px 18px; border-bottom: 1px solid var(--line);
}
.card__head h3 { margin: 0; font-size: 15px; font-weight: 700; }
.card__body { padding: 18px; }
.card__foot { padding: 14px 18px; border-top: 1px solid var(--line); }

.grid { display: grid; gap: 16px; }
.grid--4 { grid-template-columns: repeat(4, 1fr); }
.grid--3 { grid-template-columns: repeat(3, 1fr); }
.grid--2 { grid-template-columns: repeat(2, 1fr); }

/* ---------------- Statistik kartalar ---------------- */
.stat {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow);
  display: flex; gap: 14px; align-items: flex-start;
}
.stat__icon {
  width: 44px; height: 44px; border-radius: 12px; flex: none;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 20px; background: var(--brand-050); color: var(--brand);
}
.stat__icon--accent { background: var(--accent-050); color: var(--accent); }
.stat__icon--ok { background: var(--ok-bg); color: var(--ok); }
.stat__icon--warn { background: var(--warn-bg); color: var(--warn); }
.stat__label { color: var(--muted); font-size: 13px; margin-bottom: 4px; }
.stat__value { font-size: 24px; font-weight: 800; line-height: 1.15; }
.stat__delta { font-size: 12px; font-weight: 600; margin-top: 4px; }
.stat__delta--up { color: var(--ok); }
.stat__delta--down { color: var(--danger); }

/* ---------------- Jadval ---------------- */
.table-wrap { overflow-x: auto; }
table.table { width: 100%; border-collapse: collapse; font-size: 14px; }
.table th {
  text-align: left; padding: 12px 16px; white-space: nowrap;
  color: var(--muted); font-size: 12px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .05em;
  border-bottom: 1px solid var(--line); background: var(--surface-2);
}
.table td { padding: 13px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.table tr:last-child td { border-bottom: 0; }
.table tbody tr:hover { background: var(--surface-2); }
.table__thumb {
  width: 46px; height: 46px; border-radius: 10px; object-fit: cover;
  background: var(--surface-2); border: 1px solid var(--line);
}
.table__main { font-weight: 600; }
.table__sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
.table__actions { display: flex; gap: 6px; justify-content: flex-end; }

.empty { padding: 56px 20px; text-align: center; color: var(--muted); }
.empty__icon { font-size: 34px; margin-bottom: 10px; opacity: .7; }

/* ---------------- Nishonlar ---------------- */
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 10px; border-radius: 999px;
  font-size: 12px; font-weight: 600; white-space: nowrap;
  background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line);
}
.badge--ok { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
.badge--warn { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.badge--danger { background: var(--danger-bg); color: var(--danger); border-color: transparent; }
.badge--info { background: var(--info-bg); color: var(--info); border-color: transparent; }
.badge--brand { background: var(--brand-050); color: var(--brand); border-color: transparent; }
.badge--accent { background: var(--accent-050); color: var(--accent); border-color: transparent; }

/* ---------------- Tugmalar ---------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 40px; padding: 0 16px;
  border: 1px solid transparent; border-radius: var(--radius-sm);
  font: inherit; font-weight: 600; font-size: 14px;
  cursor: pointer; white-space: nowrap; text-decoration: none;
  transition: background-color .15s, border-color .15s, color .15s;
}
.btn:hover { text-decoration: none; }
.btn--primary { background: var(--brand); color: #fff; }
.btn--primary:hover { background: var(--brand-600); }
.btn--accent { background: var(--accent); color: #fff; }
.btn--accent:hover { filter: brightness(.94); }
.btn--ghost { background: var(--surface); border-color: var(--line-strong); color: var(--ink); }
.btn--ghost:hover { background: var(--surface-2); }
.btn--danger { background: var(--danger-bg); color: var(--danger); }
.btn--danger:hover { background: var(--danger); color: #fff; }
.btn--sm { height: 32px; padding: 0 11px; font-size: 13px; border-radius: 8px; }
.btn--icon { width: 32px; height: 32px; padding: 0; }
.btn:disabled { opacity: .55; cursor: not-allowed; }

/* ---------------- Formalar ---------------- */
.form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
.form-field { display: flex; flex-direction: column; }
.form-field--full { grid-column: 1 / -1; }
.form-label { font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--ink-2); }
.form-label .req { color: var(--danger); }

.input, .select, .textarea {
  width: 100%; min-height: 42px; padding: 10px 13px;
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--line-strong); border-radius: var(--radius-sm);
  font: inherit; font-size: 14px; outline: none;
  transition: border-color .15s, box-shadow .15s;
}
.textarea { min-height: 110px; resize: vertical; line-height: 1.55; }
.input:focus, .select:focus, .textarea:focus {
  border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-050);
}
.input::placeholder, .textarea::placeholder { color: var(--muted); }
.select { appearance: none; padding-right: 34px;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%),
                    linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 18px) 19px, calc(100% - 13px) 19px;
  background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }
.form-help { margin: 5px 2px 0; font-size: 12px; color: var(--muted); }
.form-error { margin: 5px 2px 0; font-size: 12.5px; color: var(--danger); font-weight: 500; }
.has-error .input, .has-error .select, .has-error .textarea { border-color: var(--danger); }

.check { display: flex; align-items: center; gap: 9px; cursor: pointer; user-select: none; }
.check input { width: 18px; height: 18px; accent-color: var(--brand); cursor: pointer; }
.check span { font-size: 14px; }

.switchbox {
  display: flex; align-items: center; justify-content: space-between; gap: 14px;
  padding: 12px 14px; background: var(--surface-2);
  border: 1px solid var(--line); border-radius: var(--radius-sm);
}
.switch { position: relative; width: 44px; height: 25px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch__slider {
  position: absolute; inset: 0; background: var(--line-strong);
  border-radius: 999px; cursor: pointer; transition: background-color .18s;
}
.switch__slider::before {
  content: ""; position: absolute; width: 19px; height: 19px; left: 3px; top: 3px;
  background: #fff; border-radius: 50%; transition: transform .18s;
}
.switch input:checked + .switch__slider { background: var(--brand); }
.switch input:checked + .switch__slider::before { transform: translateX(19px); }

.form-actions {
  display: flex; gap: 10px; align-items: center;
  padding-top: 18px; margin-top: 4px; border-top: 1px solid var(--line);
}
.form-actions .spacer { margin-left: auto; }

/* Rasm yuklash */
.upload {
  display: flex; align-items: center; gap: 14px;
  padding: 12px; border: 1px dashed var(--line-strong);
  border-radius: var(--radius-sm); background: var(--surface-2);
}
.upload__preview {
  width: 74px; height: 74px; border-radius: 10px; object-fit: cover;
  background: var(--surface); border: 1px solid var(--line); flex: none;
}
.upload input[type="file"] { font-size: 13px; color: var(--ink-2); }

/* Til yorliqlari (tarjimalar) */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 18px; flex-wrap: wrap; }
.tab {
  padding: 9px 15px; border: 0; background: none; cursor: pointer;
  font: inherit; font-size: 13.5px; font-weight: 600; color: var(--muted);
  border-bottom: 2px solid transparent; margin-bottom: -1px;
}
.tab:hover { color: var(--ink); }
.tab.is-active { color: var(--brand); border-bottom-color: var(--brand); }
.tabpane { display: none; }
.tabpane.is-active { display: block; }

/* ---------------- Filtr paneli ---------------- */
.filters {
  display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
  padding: 14px 18px; border-bottom: 1px solid var(--line);
}
.filters .input, .filters .select { min-height: 38px; width: auto; min-width: 160px; }
.search { position: relative; flex: 1; min-width: 200px; }
.search .input { width: 100%; padding-left: 36px; }
.search__icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); }

/* ---------------- Sahifalash ---------------- */
.pagination { display: flex; gap: 6px; align-items: center; justify-content: center; padding: 16px; flex-wrap: wrap; }
.pagination a, .pagination span {
  min-width: 34px; height: 34px; padding: 0 10px;
  display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid var(--line); border-radius: 8px;
  color: var(--ink-2); font-size: 13px; font-weight: 600;
}
.pagination a:hover { border-color: var(--brand); color: var(--brand); text-decoration: none; }
.pagination .is-current { background: var(--brand); border-color: var(--brand); color: #fff; }
.pagination .is-disabled { opacity: .4; }
.pagination__info { color: var(--muted); font-weight: 500; border: 0; }

/* ---------------- Xabarlar ---------------- */
.messages { position: fixed; right: 22px; top: 78px; z-index: 200; display: flex; flex-direction: column; gap: 10px; }
.message {
  min-width: 260px; max-width: 380px;
  padding: 13px 16px; border-radius: var(--radius-sm);
  box-shadow: var(--shadow-lg); font-size: 14px; font-weight: 500;
  background: var(--surface); border-left: 4px solid var(--brand); color: var(--ink);
  animation: slideIn .25s ease;
}
.message--success { border-left-color: var(--ok); }
.message--error { border-left-color: var(--danger); }
.message--warning { border-left-color: var(--warn); }
@keyframes slideIn { from { opacity: 0; transform: translateX(20px); } }

/* ---------------- Grafiklar ---------------- */
.chart { width: 100%; height: 260px; display: block; }
.chart-legend { display: flex; gap: 18px; flex-wrap: wrap; padding: 0 18px 16px; font-size: 13px; color: var(--ink-2); }
.chart-legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; margin-right: 6px; }

.modal { position: fixed; inset: 0; background: rgba(8,14,30,.55); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 16px; animation: fadeIn .15s ease; }
.modal__box { background: var(--surface); color: var(--ink); border-radius: 18px; width: 100%; max-width: 620px; max-height: calc(100vh - 32px); display: flex; flex-direction: column; box-shadow: 0 24px 70px rgba(0,0,0,.3); }
.modal__head { display: flex; align-items: center; gap: 12px; padding: 18px 20px; border-bottom: 1px solid var(--line); }
.modal__head h3 { flex: 1; font-size: 17px; margin: 0; }
.modal__body { padding: 20px; overflow-y: auto; }
.modal__foot { display: flex; gap: 10px; align-items: center; padding: 14px 20px; border-top: 1px solid var(--line); }
@keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
.progress { height: 7px; background: var(--line); border-radius: 999px; overflow: hidden; min-width: 90px; }
.progress__bar { height: 100%; background: var(--brand); border-radius: 999px; }

/* ---------------- Kurs daraxti ---------------- */
.module {
  border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--surface); margin-bottom: 14px; overflow: hidden;
}
.module__head {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px; background: var(--surface-2); border-bottom: 1px solid var(--line);
}
.module__title { font-weight: 700; font-size: 15px; }
.module__meta { color: var(--muted); font-size: 12.5px; }
.lesson-row {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px; border-bottom: 1px solid var(--line);
}
.lesson-row:last-child { border-bottom: 0; }
.lesson-row__num {
  width: 28px; height: 28px; border-radius: 8px; flex: none;
  background: var(--brand-050); color: var(--brand);
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700;
}
.lesson-row__title { font-weight: 600; }
.lesson-row__meta { color: var(--muted); font-size: 12.5px; margin-top: 2px; display: flex; gap: 10px; flex-wrap: wrap; }

/* ---------------- Kirish sahifasi ---------------- */
.auth-wrap {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  padding: 24px; background: var(--bg);
}
.auth-box {
  width: 100%; max-width: 400px; padding: 34px 30px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 18px; box-shadow: var(--shadow-lg);
}
.auth-box__logo { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.auth-box__logo img { width: 34px; height: 34px; }
.auth-box__logo span { font-size: 20px; font-weight: 800; letter-spacing: .04em; }
.auth-box h1 { margin: 14px 0 4px; font-size: 20px; }
.auth-box p.sub { margin: 0 0 22px; color: var(--muted); font-size: 13.5px; }

/* ---------------- Moslashuvchanlik ---------------- */
@media (max-width: 1100px) {
  .grid--4 { grid-template-columns: repeat(2, 1fr); }
  .grid--3 { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 900px) {
  .sidebar {
    position: fixed; left: 0; top: 0; z-index: 60;
    transform: translateX(-100%); transition: transform .22s;
  }
  body.nav-open .sidebar { transform: translateX(0); box-shadow: var(--shadow-lg); }
  body.nav-open::after {
    content: ""; position: fixed; inset: 0; background: rgba(6, 12, 24, .5); z-index: 50;
  }
  .burger { display: inline-flex; }
  .page { padding: 18px 16px 60px; }
  .topbar { padding: 12px 16px; }
  .form-grid { grid-template-columns: 1fr; }
  .grid--4, .grid--3, .grid--2 { grid-template-columns: 1fr; }
  .userchip__name, .userchip__role { display: none; }
  .messages { right: 12px; left: 12px; top: 70px; }
  .message { max-width: none; }
}


/* Bitta faylli panel uchun qo'shimcha */
.messages .message { cursor: default; }
#page .empty { width: 100%; }

  </style>

<script>
  /* ================= Ma'lumot qatlami ================= */
  const PLANS = { start: 'Start', pro: 'Pro', vip: 'VIP' };
  const PAGE_TITLES = { dashboard: 'Dashboard', subscriptions: 'Obunalar', payments: "To'lovlar", notifications: 'Bildirishnomalar', feedback: 'Takliflar', users: 'Foydalanuvchilar', system: 'Tizim holati', courses: 'Kurslar', schools: 'Maktablar' };
  let token = sessionStorage.getItem('vector_admin') || '';
  const $ = (id) => document.getElementById(id);
  const money = (n) => Number(n || 0).toLocaleString('ru-RU').replace(/,/g, ' ');
  const pad = (n) => ('0' + n).slice(-2);
  const date = (t) => { if (!t) return '—'; const d = new Date(t); return pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '.' + d.getFullYear() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); };
  const day = (t) => date(t).split(' ')[0];
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const initial = (u) => esc(((u.firstName || '?')[0] || '?').toUpperCase());
  const empty = (icon, text) => `<div class="empty"><div class="empty__icon">${icon}</div>${text}</div>`;

  function notify(text, type) {
    const m = document.createElement('div');
    m.className = 'message message--' + (type || 'success');
    m.textContent = text;
    $('messages').appendChild(m);
    setTimeout(() => { m.style.transition = 'opacity .4s'; m.style.opacity = '0'; setTimeout(() => m.remove(), 400); }, 3500);
  }

  async function api(path, opts) {
    opts = opts || {};
    const res = await fetch(path, {
      method: opts.method || 'GET',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body: opts.body ? JSON.stringify(opts.body) : undefined
    });
    const data = await res.json().catch(() => ({}));
    if (res.status === 401 && path !== '/api/admin/login') { logout(); throw new Error('Qayta kiring'); }
    if (!res.ok) throw new Error(data.error || 'Xatolik yuz berdi');
    return data;
  }

  /* ================= Kirish / chiqish ================= */
  async function login(e) {
    e.preventDefault();
    const btn = $('login-btn'); btn.disabled = true;
    try {
      const r = await api('/api/admin/login', { method: 'POST', body: { password: $('admin-pass').value } });
      token = r.token; sessionStorage.setItem('vector_admin', token);
      showApp();
    } catch (err) { notify(err.message, 'error'); }
    finally { btn.disabled = false; }
  }
  function logout() {
    token = ''; sessionStorage.removeItem('vector_admin');
    $('app-view').style.display = 'none'; $('login-view').style.display = 'flex';
  }
  function showApp() {
    $('login-view').style.display = 'none'; $('app-view').style.display = 'flex';
    if (!location.hash) location.hash = '#dashboard'; else route();
  }

  /* ================= Marshrut ================= */
  const cache = {};
  async function route(force) {
    if (!token) return;
    const page = (location.hash || '#dashboard').slice(1).split('?')[0];
    const name = PAGE_TITLES[page] ? page : 'dashboard';
    document.querySelectorAll('.nav__link').forEach(a => a.classList.toggle('is-active', a.dataset.page === name));
    $('page-title').textContent = PAGE_TITLES[name];
    document.title = PAGE_TITLES[name] + ' — VECTOR';
    document.body.classList.remove('nav-open');
    $('page').innerHTML = empty('⏳', 'Yuklanmoqda...');
    try { await PAGES[name](force); }
    catch (err) { $('page').innerHTML = empty('⚠️', esc(err.message)); }
    if (window.renderCharts) window.renderCharts();
  }
  window.addEventListener('hashchange', () => route());

  async function load(key, path, force) {
    if (!force && cache[key] && Date.now() - cache[key].at < 30000) return cache[key].data;
    const data = await api(path);
    cache[key] = { data, at: Date.now() };
    return data;
  }

  /* 30 kunlik grafik ma'lumoti */
  function series(items, field, valueFn) {
    const labels = [], values = [], start = new Date(); start.setHours(0, 0, 0, 0);
    const base = start.getTime() - 29 * 864e5;

      const idx = Math.floor((t - base) / 864e5);

    });
    return { labels, values };

  function readDuration(file) {
    return new Promise(res => {
      const v = document.createElement('video'); v.preload = 'metadata';
      const url = URL.createObjectURL(file);
      const done = (d) => { URL.revokeObjectURL(url); res(d); };
      v.onloadedmetadata = () => done(isFinite(v.duration) ? v.duration : 0);
      v.onerror = () => done(0);
      setTimeout(() => done(0), 8000);
      v.src = url;
    });
  }

  async function uploadVideo(id, file) {
    if (!/^video\//.test(file.type) && !/\.(mp4|m4v|mov|webm|mkv)$/i.test(file.name)) return notify('Faqat video fayl tanlang (mp4)', 'error');
    if (uploads[id]) return notify('Bu darsga video yuklanmoqda', 'error');
    let r;
    try { r = await api('/api/admin/lessons/' + id + '/upload-url', { method: 'POST', body: { filename: file.name } }); }
    catch (e) { return notify(e.message, 'error'); }
    const duration = await readDuration(file);
    const xhr = new XMLHttpRequest();
    uploads[id] = { pct: 0, loaded: 0, total: file.size, xhr };
    refreshVideoCell(id);
    xhr.upload.onprogress = (e) => {
      if (!e.lengthComputable) return;
      Object.assign(uploads[id], { pct: Math.floor(e.loaded / e.total * 100), loaded: e.loaded });
      refreshVideoCell(id);
    };
    const finish = async (ok, msg) => {
      delete uploads[id];
      window.removeEventListener('beforeunload', warnLeave);
      if (!ok) { notify(msg, 'error'); refreshVideoCell(id); return; }
      try {
        await api('/api/admin/lessons/' + id + '/video', { method: 'POST', body: { key: r.key, size: file.size, name: file.name, duration } });
        notify('✅ Video yuklandi: ' + file.name);
      } catch (e) { notify(e.message, 'error'); }
      if ((location.hash || '').indexOf('#courses?id=') === 0) route(true);
    };
    xhr.onload = () => finish(xhr.status >= 200 && xhr.status < 300, "Yuklashda xato (" + xhr.status + "). R2 CORS sozlamasini tekshiring");
    xhr.onerror = () => finish(false, "Yuklash uzildi. Internetni va R2 CORS sozlamasini tekshiring");
    xhr.onabort = () => finish(false, "Yuklash to'xtatildi");
    xhr.open('PUT', r.uploadUrl);
    xhr.setRequestHeader('Content-Type', file.type || 'video/mp4');
    window.addEventListener('beforeunload', warnLeave);
    xhr.send(file);
  }
  function warnLeave(e) { e.preventDefault(); e.returnValue = ''; }
  function cancelUpload(id) { if (uploads[id] && confirm("Yuklashni to'xtatasizmi?")) uploads[id].xhr.abort(); }

    let theme = 'light';
    try { theme = localStorage.getItem('vector_theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } catch (e) {}
    document.documentElement.setAttribute('data-theme', theme);
    document.querySelectorAll('[data-theme-icon]').forEach(el => el.textContent = theme === 'dark' ? '☀️' : '🌙');
    if (token) { showApp(); checkNewFeedback(); } else { $('login-view').style.display = 'flex'; $('admin-pass').focus(); }
  })();
</script>

<script>
/* ============ VECTOR admin panel — umumiy skriptlar ============ */
(function () {
  "use strict";

  /* --- Mavzu (yorug'/tungi) --- */
  var root = document.documentElement;

  function applyTheme(theme) {
    root.setAttribute("data-theme", theme);
    try { localStorage.setItem("vector_theme", theme); } catch (e) {}
    document.querySelectorAll("[data-theme-icon]").forEach(function (el) {
      el.textContent = theme === "dark" ? "☀️" : "🌙";
    });
    // Serverda ham eslab qolamiz (cookie orqali)
    document.cookie = "vector_theme=" + theme + ";path=/;max-age=31536000;samesite=lax";
  }

  document.addEventListener("click", function (e) {
    var toggle = e.target.closest("[data-theme-toggle]");
    if (toggle) {
      e.preventDefault();
      applyTheme(root.getAttribute("data-theme") === "dark" ? "light" : "dark");
    }
  });

  /* --- Ochiluvchi menyular --- */
  document.addEventListener("click", function (e) {
    var trigger = e.target.closest("[data-dropdown]");
    document.querySelectorAll(".dropdown.is-open").forEach(function (d) {
      if (!trigger || d !== trigger.closest(".dropdown")) d.classList.remove("is-open");
    });
    if (trigger) {
      e.preventDefault();
      trigger.closest(".dropdown").classList.toggle("is-open");
    }
  });

  /* --- Mobil menyu --- */
  document.addEventListener("click", function (e) {
    if (e.target.closest("[data-burger]")) {
      e.preventDefault();
      document.body.classList.toggle("nav-open");
    } else if (document.body.classList.contains("nav-open") && !e.target.closest(".sidebar")) {
      document.body.classList.remove("nav-open");
    }
  });

  /* --- Til yorliqlari --- */
  document.addEventListener("click", function (e) {
    var tab = e.target.closest("[data-tab]");
    if (!tab) return;
    e.preventDefault();
    var group = tab.closest("[data-tabs]");
    var name = tab.getAttribute("data-tab");
    group.querySelectorAll("[data-tab]").forEach(function (t) { t.classList.toggle("is-active", t === tab); });
    group.querySelectorAll("[data-tabpane]").forEach(function (p) {
      p.classList.toggle("is-active", p.getAttribute("data-tabpane") === name);
    });
  });

  /* --- O'chirishni tasdiqlash --- */
  document.addEventListener("submit", function (e) {
    var form = e.target;
    var text = form.getAttribute("data-confirm");
    if (text && !window.confirm(text)) e.preventDefault();
  });

  /* --- Rasm tanlanganda oldindan ko'rsatish --- */
  document.addEventListener("change", function (e) {
    var input = e.target;
    if (input.type !== "file" || !input.files || !input.files[0]) return;
    var preview = input.closest(".upload") && input.closest(".upload").querySelector(".upload__preview");
    if (!preview || !/^image\//.test(input.files[0].type)) return;
    var reader = new FileReader();
    reader.onload = function (ev) { preview.src = ev.target.result; };
    reader.readAsDataURL(input.files[0]);
  });

  /* --- Xabarlarni avtomatik yopish --- */
  setTimeout(function () {
    document.querySelectorAll(".message").forEach(function (m) {
      m.style.transition = "opacity .4s";
      m.style.opacity = "0";
      setTimeout(function () { m.remove(); }, 400);
    });
  }, 5000);

  /* --- Filtr formasini avtomatik yuborish --- */
  document.addEventListener("change", function (e) {
    if (e.target.matches("[data-autosubmit]")) e.target.form.submit();
  });

  /* ================= Oddiy SVG grafiklar =================
     Tashqi kutubxonasiz — panel internetsiz ham ishlaydi. */

  /* Katta sonlarni qisqartiradi: 1 250 000 -> 1.3M */
  function shortNumber(value) {
    if (Math.abs(value) < 10 && value % 1 !== 0) return value.toFixed(1).replace(/\.0$/, "");
    var n = Math.round(value);
    if (Math.abs(n) >= 1000000) return (n / 1000000).toFixed(n % 1000000 === 0 ? 0 : 1) + "M";
    if (Math.abs(n) >= 1000) return (n / 1000).toFixed(n % 1000 === 0 ? 0 : 1) + "k";
    return String(n);
  }

  function scale(values, height, padTop) {
    var max = Math.max.apply(null, values.concat([1]));
    var usable = height - padTop;
    return values.map(function (v) { return height - (v / max) * usable; });
  }

  function drawLine(el) {
    var data = JSON.parse(el.getAttribute("data-values") || "[]");
    var labels = JSON.parse(el.getAttribute("data-labels") || "[]");
    var color = el.getAttribute("data-color") || "#1f6feb";
    if (!data.length) return;

    var w = el.clientWidth || 600, h = el.clientHeight || 260;
    var padL = 44, padB = 26, padT = 16, padR = 12;
    var innerW = w - padL - padR, innerH = h - padB - padT;
    var max = Math.max.apply(null, data.concat([1]));
    var stepX = data.length > 1 ? innerW / (data.length - 1) : 0;

    var points = data.map(function (v, i) {
      return [padL + i * stepX, padT + innerH - (v / max) * innerH];
    });
    var path = points.map(function (p, i) { return (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1); }).join(" ");
    var area = path + " L" + points[points.length - 1][0].toFixed(1) + " " + (padT + innerH) +
               " L" + points[0][0].toFixed(1) + " " + (padT + innerH) + " Z";

    var gridLines = "", yLabels = "";
    for (var g = 0; g <= 4; g++) {
      var y = padT + (innerH / 4) * g;
      gridLines += '<line x1="' + padL + '" y1="' + y + '" x2="' + (w - padR) + '" y2="' + y +
                   '" stroke="currentColor" stroke-opacity=".12"/>';
      yLabels += '<text x="' + (padL - 8) + '" y="' + (y + 4) +
                 '" text-anchor="end" font-size="11" fill="currentColor" fill-opacity=".55">' +
                 shortNumber(max - (max / 4) * g) + '</text>';
    }

    var xLabels = labels.map(function (t, i) {
      if (labels.length > 10 && i % Math.ceil(labels.length / 8) !== 0) return "";
      return '<text x="' + (padL + i * stepX) + '" y="' + (h - 6) +
             '" text-anchor="middle" font-size="11" fill="currentColor" fill-opacity=".55">' + t + '</text>';
    }).join("");

    var dots = points.map(function (p, i) {
      return '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="3.2" fill="' + color +
             '"><title>' + (labels[i] || "") + ": " + shortNumber(data[i]) + '</title></circle>';
    }).join("");

    el.innerHTML =
      '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" height="100%" style="color:var(--muted)">' +
      '<defs><linearGradient id="g' + (el.id || "x") + '" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="' + color + '" stop-opacity=".28"/>' +
      '<stop offset="100%" stop-color="' + color + '" stop-opacity="0"/></linearGradient></defs>' +
      gridLines + yLabels + xLabels +
      '<path d="' + area + '" fill="url(#g' + (el.id || "x") + ')"/>' +
      '<path d="' + path + '" fill="none" stroke="' + color + '" stroke-width="2.5" ' +
      'stroke-linejoin="round" stroke-linecap="round"/>' + dots + '</svg>';
  }

  function drawBars(el) {
    var data = JSON.parse(el.getAttribute("data-values") || "[]");
    var labels = JSON.parse(el.getAttribute("data-labels") || "[]");
    var color = el.getAttribute("data-color") || "#1f6feb";
    if (!data.length) return;

    var w = el.clientWidth || 600, h = el.clientHeight || 260;
    var padL = 44, padB = 28, padT = 16, padR = 12;
    var innerW = w - padL - padR, innerH = h - padB - padT;
    var max = Math.max.apply(null, data.concat([1]));
    var slot = innerW / data.length;
    var bw = Math.min(38, slot * 0.62);

    var bars = data.map(function (v, i) {
      var bh = (v / max) * innerH;
      var x = padL + slot * i + (slot - bw) / 2;
      var y = padT + innerH - bh;
      return '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + bw.toFixed(1) +
             '" height="' + Math.max(bh, 1).toFixed(1) + '" rx="6" fill="' + color + '">' +
             '<title>' + (labels[i] || "") + ": " + shortNumber(v) + '</title></rect>';
    }).join("");

    var gridLines = "", yLabels = "";
    for (var g = 0; g <= 4; g++) {
      var y = padT + (innerH / 4) * g;
      gridLines += '<line x1="' + padL + '" y1="' + y + '" x2="' + (w - padR) + '" y2="' + y +
                   '" stroke="currentColor" stroke-opacity=".12"/>';
      yLabels += '<text x="' + (padL - 8) + '" y="' + (y + 4) + '" text-anchor="end" font-size="11" ' +
                 'fill="currentColor" fill-opacity=".55">' + shortNumber(max - (max / 4) * g) + '</text>';
    }
    var xLabels = labels.map(function (t, i) {
      return '<text x="' + (padL + slot * i + slot / 2) + '" y="' + (h - 8) +
             '" text-anchor="middle" font-size="11" fill="currentColor" fill-opacity=".55">' + t + '</text>';
    }).join("");

    el.innerHTML = '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" height="100%" style="color:var(--muted)">' +
      gridLines + yLabels + xLabels + bars + '</svg>';
  }

  function drawDonut(el) {
    var data = JSON.parse(el.getAttribute("data-values") || "[]");
    var labels = JSON.parse(el.getAttribute("data-labels") || "[]");
    var colors = JSON.parse(el.getAttribute("data-colors") || '["#1f6feb","#ff6a00","#16a34a","#8b5cf6","#0ea5e9"]');
    var total = data.reduce(function (a, b) { return a + b; }, 0);
    var size = Math.min(el.clientWidth || 240, el.clientHeight || 240);
    var cx = size / 2, cy = size / 2, r = size / 2 - 12, thickness = 26;

    if (!total) {
      el.innerHTML = '<div class="empty" style="padding:30px">—</div>';
      return;
    }

    var angle = -Math.PI / 2, arcs = "";
    data.forEach(function (v, i) {
      var slice = (v / total) * Math.PI * 2;
      var end = angle + slice;
      var large = slice > Math.PI ? 1 : 0;
      var x1 = cx + r * Math.cos(angle), y1 = cy + r * Math.sin(angle);
      var x2 = cx + r * Math.cos(end), y2 = cy + r * Math.sin(end);
      arcs += '<path d="M' + x1.toFixed(2) + ' ' + y1.toFixed(2) + ' A' + r + ' ' + r + ' 0 ' + large + ' 1 ' +
              x2.toFixed(2) + ' ' + y2.toFixed(2) + '" fill="none" stroke="' + colors[i % colors.length] +
              '" stroke-width="' + thickness + '"><title>' + (labels[i] || "") + ": " + v + '</title></path>';
      angle = end;
    });

    el.innerHTML = '<svg viewBox="0 0 ' + size + ' ' + size + '" width="100%" height="100%">' + arcs +
      '<text x="' + cx + '" y="' + (cy - 2) + '" text-anchor="middle" font-size="22" font-weight="800" ' +
      'fill="currentColor">' + total + '</text></svg>';
  }

  function renderCharts() {
    document.querySelectorAll("[data-chart]").forEach(function (el) {
      var type = el.getAttribute("data-chart");
      try {
        if (type === "line") drawLine(el);
        else if (type === "bar") drawBars(el);
        else if (type === "donut") drawDonut(el);
      } catch (err) { /* grafik chizilmasa sahifa baribir ishlaydi */ }
    });
  }

  window.renderCharts = renderCharts;
  window.addEventListener("load", renderCharts);
  var resizeTimer;
  window.addEventListener("resize", function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(renderCharts, 200);
  });
})();

</script>
</body>
</html>
